<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>こんだて逆算ノート</title>
  <meta name="description" content="献立から、いちばん安い買い方と使い切りまで考える買い物アプリ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261021b">
</head>
<body>
  <!-- 水彩のにじみ（背景） -->
  <svg class="wash" aria-hidden="true" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="wc" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7"/>
        <feDisplacementMap in="SourceGraphic" scale="70"/>
        <feGaussianBlur stdDeviation="8"/>
      </filter>
    </defs>
    <ellipse cx="80" cy="90" rx="260" ry="160" fill="#dcecf6" filter="url(#wc)"/>
    <ellipse cx="1150" cy="220" rx="220" ry="180" fill="#fdf1d6" filter="url(#wc)"/>
    <ellipse cx="1050" cy="860" rx="300" ry="160" fill="#e2f1f8" filter="url(#wc)"/>
    <ellipse cx="120" cy="820" rx="200" ry="130" fill="#e8f4ec" filter="url(#wc)"/>
  </svg>

  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" fill="none" stroke="#3b3631" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M30 30 C 29 20, 33 12, 40.5 5.5" stroke="#7f9f7a"/>
        <path d="M35.5 30.5 C 37 22, 42 15.5, 49 11.5" stroke="#7f9f7a"/>
        <path d="M22.5 31 L 16.8 16.5 C 16.2 13.4, 20 12.6, 21.2 15.2 L 27.5 30" fill="#f2c9a8" stroke="#c9775a"/>
        <path d="M18.2 14 c -2.2 -3.6 -0.6 -6.2 0.8 -7.4 M 19.6 13.6 c 1.6 -3.8 4.6 -4.4 6 -4.2" stroke="#7f9f7a"/>
        <path d="M8 30.6 C 20 29.2, 44 29.6, 56.2 31.2 L 51.6 52.8 C 51.1 55, 49.6 56.3, 47.1 56.1 C 37 56.9, 26 56.7, 17.2 56 C 14.9 55.8, 13.5 54.6, 13.1 52.5 Z" fill="#f6e7c8"/>
        <path d="M13.8 39.2 C 26 38.1, 40 38.7, 52.2 39.6 M 15.6 47.2 C 27 46.5, 39 46.9, 50.2 47.6" opacity=".5"/>
        <path d="M24 31 L 22.6 55.6 M 32 30.6 L 32.1 56.4 M 40 31 L 41.4 55.9" opacity=".35"/>
      </svg>
      <div>
        <h1>こんだて逆算ノート</h1>
        <p class="tagline">献立から、いちばん安い買い方と使い切りまで。</p>
        <div id="area-chip"></div>
      </div>
    </div>
  </header>

  <main>
    <section id="view-shop" class="view">
      <div id="live-row"></div>
      <div id="offers"></div>
      <nav class="steps" id="steps" aria-label="買い物の流れ"></nav>

      <div class="step-panel" data-s="1">
        <div class="step-head">
          <h2>作りたい献立をえらぶ <span class="muted small">1人分ずつ</span></h2>
          <button class="link small" data-action="clear">リセット</button>
        </div>
        <div id="picked"></div>
        <div id="tagbar"></div>
        <div id="add-form"></div>
        <div id="recipes"></div>
      </div>

      <div class="step-panel" data-s="2" hidden>
        <div class="step-head"><h2>いちばんおトクな買い方</h2></div>
        <div id="plan"></div>
        <div id="sugg-box"></div>
        <div class="step-head"><h2>使い切りチェック <span class="muted small">買う前に、余りそうなものを確認</span></h2></div>
        <div id="leftover"></div>
      </div>

      <div class="step-panel" data-s="3" hidden>
        <div class="step-head"><h2>買い物リスト</h2></div>
        <div id="list"></div>
      </div>

      <div class="step-panel" data-s="4" hidden>
        <div class="step-head"><h2>家にある食材</h2></div>
        <div id="recorded"></div>
        <div id="pantry"></div>
      </div>
    </section>

    <section id="view-store" class="view" hidden>
      <div class="step-head"><h2>お店の画面 <span class="muted small">来店前の献立データから、明日の需要を先読み</span></h2></div>
      <div id="store-view"></div>
    </section>

    <section id="view-trend" class="view" hidden>
      <div id="trend-view"></div>
    </section>

    <section id="view-history" class="view" hidden>
      <div class="step-head"><h2>買い物のきろく <span class="muted small">実際に買ったもの・払った金額</span></h2></div>
      <div id="history-view"></div>
    </section>

    <section id="view-account" class="view" hidden>
      <div class="step-head"><h2>アカウント</h2></div>
      <div id="account-view"></div>
    </section>

    <section id="view-prices" class="view" hidden>
      <div class="step-head"><h2>価格メモ</h2></div>
      <div id="price-view"></div>
    </section>
  </main>

  <div id="mbar" class="mbar" hidden></div>
  <nav class="bnav" aria-label="画面の切り替え">
    <button class="tab" data-tab="shop"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5h17l-1.8 9.2a2 2 0 0 1-2 1.6H7.3a2 2 0 0 1-2-1.6z"/><path d="M8 9.5l3-5.5M16 9.5l-3-5.5"/><path d="M9 13.5v3M12 13.5v3M15 13.5v3"/></svg><span class="bn-label">かいもの</span></button>
    <button class="tab" data-tab="history"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h9.5l3 3v14H6z"/><path d="M15.5 3.5v3h3"/><path d="M9 11h6M9 14.5h6M9 18h3.5"/></svg><span class="bn-label">きろく</span></button>
    <button class="tab" data-tab="prices"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.5 1.5 0 0 1 0 2.1l-6.1 6.1a1.5 1.5 0 0 1-2.1 0z"/><circle cx="8.2" cy="8.2" r="1.4"/></svg><span class="bn-label">価格メモ</span></button>
    <button class="tab" data-tab="store"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5V20h16V9.5"/><path d="M3 9.5l1.6-5h14.8l1.6 5a2.5 2.5 0 0 1-4.5 1.4 2.5 2.5 0 0 1-4.5 0 2.5 2.5 0 0 1-4.5 0A2.5 2.5 0 0 1 3 9.5z"/><path d="M10 20v-5h4v5"/></svg><span class="bn-label">お店</span></button>
    <button class="tab" data-tab="trend"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16"/><path d="M6.5 16v-4M11 16V8.5M15.5 16v-6M20 16V5"/><path d="M5 9l5-4 4 3 5-4"/></svg><span class="bn-label">売れ筋</span></button>
    <button class="tab tab-acc" data-tab="account" id="acc-tab" aria-label="アカウント"><span class="avatar">?</span><span class="bn-label">アカウント</span></button>
  </nav>


  <footer class="foot">
    <p>価格・需要はデモ用のサンプルです。米と調味料は家にある前提で計算しています。</p>
  </footer>

  <div id="auth"></div>
  <div id="tutorial" hidden></div>
  <div id="live" hidden></div>

  <script src="js/data.js?v=20261021b"></script>
  <script src="js/photos.js?v=20261021b"></script>
  <script src="js/nearby.js?v=20261021b"></script>
  <script src="js/auth.js?v=20261021b"></script>
  <script src="js/receipt-ocr.js?v=20261021b"></script>
  <script src="js/app.js?v=20261021b"></script>
  <script src="js/live.js?v=20261021b"></script>
  <script src="js/tutorial.js?v=20261021b"></script>
</body>
</html>
